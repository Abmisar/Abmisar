name: Update GitHub activity

on:
  schedule:
    # 03:17 in Saudi Arabia; avoid the busy start of the hour.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/github_activity.py
      - .github/workflows/github-activity.yml

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate contribution charts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 scripts/github_activity.py
      - name: Publish changed charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-light.svg assets/activity-dark.svg
          if git diff --cached --quiet; then
            echo 'Activity charts are already up to date.'
          else
            git commit -m 'Update GitHub activity charts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
